name: Generate Blog Post

# Triggered by:
#  - Built-in schedule (Mon & Thu 09:00 PKT) — no Zapier needed
#  - Zapier (optional: Webhooks POST to /repos/{owner}/{repo}/dispatches with event_type "generate-blog-post")
#  - Manual run from the Actions tab (optionally passing a specific keyword)
on:
  schedule:
    - cron: "0 4 * * 1,4" # Mon & Thu 04:00 UTC = 09:00 PKT
  repository_dispatch:
    types: [generate-blog-post]
  workflow_dispatch:
    inputs:
      keyword:
        description: "Target keyword (optional — defaults to next pending topic in seo/content-calendar.json)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # required by anthropics/claude-code-action for OIDC token exchange
  actions: read

concurrency:
  group: blog-post-generation
  cancel-in-progress: false

jobs:
  write-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate blog post with Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npx:*),Bash(npm:*),Bash(date:*),Bash(node:*)"
          prompt: |
            You are the automated SEO content writer for pdfandimage.com (a free PDF & image tools site).
            Your job: write ONE new blog post and open a pull request. Follow these steps exactly.

            1. PICK THE TOPIC
               - Requested keyword from workflow input (may be empty): "${{ inputs.keyword }}"
               - If a keyword was provided, use it. Otherwise read seo/content-calendar.json
                 and pick the FIRST topic with status "pending".
               - Run `date +%Y-%m-%d` to get today's date and use it everywhere a date is needed.

            2. STUDY THE EXISTING PATTERN
               - Read src/lib/blogPosts.ts carefully. Note the exact BlogPost interface
                 (slug, title, metaTitle, metaDescription, keywords, excerpt, category,
                 readTime, datePublished, dateModified, relatedTool, relatedTools,
                 sections with heading/paragraphs/steps/bullets/tip, faqs).
               - Read src/lib/toolsRegistry.ts to confirm which tool slugs exist.
                 ONLY link to slugs that actually exist in the registry.

            3. WRITE THE POST (append a new object to the BLOG_POSTS array)
               - 1,200–2,000 words of genuinely useful content targeting the keyword.
               - metaTitle: 50–60 chars, primary keyword first.
               - metaDescription: 120–155 chars.
               - Exactly one section with numbered `steps` (3–6 steps) that walks the reader
                 through doing the task with the related tool on pdfandimage.com.
               - 4–6 FAQs answering real questions people search for around the keyword.
               - relatedTool: the tool slug from the calendar. relatedTools: 2–3 additional
                 EXISTING tool slugs that fit the topic.
               - Tone: practical, direct, no fluff, no keyword stuffing. Mention competitor
                 categories generically (e.g. "most online converters") — never disparage
                 specific brands.
               - The slug must be unique (check existing BLOG_POSTS slugs first).

            4. UPDATE THE CALENDAR
               - In seo/content-calendar.json set the chosen topic's status to "published"
                 and add "publishedSlug" and "publishedDate" fields.
               - Skip this step if the keyword came from workflow input and is not in the calendar.

            5. VERIFY
               - Run `npx tsc --noEmit`. Fix any type errors you introduced before continuing.

            6. OPEN A PULL REQUEST (do NOT push to main directly)
               - git config user.name "claude-blog-bot" and user.email "actions@github.com"
               - Create branch: blog/<slug>
               - Commit ONLY src/lib/blogPosts.ts and seo/content-calendar.json with message:
                 "blog: add post '<slug>' targeting '<keyword>'"
               - Push the branch and run:
                 gh pr create --title "Blog: <post title>" --body "<one-paragraph summary, target keyword, word count, internal links used. End with: 'Auto-generated by the blog pipeline — review before merging.'>" --label seo-content || gh pr create --title "Blog: <post title>" --body "<same body>"
                 (the fallback without --label handles the case where the label doesn't exist yet)

            HARD RULES:
            - Never modify any file other than src/lib/blogPosts.ts and seo/content-calendar.json.
            - Never merge the PR yourself. The human reviews and merges.
            - If there are no pending topics and no keyword input, exit gracefully with a log message and do nothing.
